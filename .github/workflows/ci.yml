name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `prisma generate` and `next build` don't complain.
      # No live services are contacted during CI.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      REDIS_URL: "redis://localhost:6379"
      LLM_PROVIDER: "mock"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify core (no DB / no API keys required)
        run: npm run verify:core

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
