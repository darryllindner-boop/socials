name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy SQLite URL so `prisma generate` and `next build` don't complain.
      # No live services are contacted during CI.
      DATABASE_URL: "file:./prisma/dev.db"
      LLM_PROVIDER: "mock"
      # Don't boot the in-process scheduler during the build.
      RUN_INPROCESS_SCHEDULER: "0"
      # CI doesn't run Electron; skip the ~100MB binary download on install.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify core (no DB / no API keys required)
        run: npm run verify:core

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
